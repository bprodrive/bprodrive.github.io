<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Visual Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Highlight visual saat elemen difokuskan untuk diedit */
    [contenteditable="true"]:hover {
      outline: 2px dashed #6366f1;
      outline-offset: 4px;
      cursor: text;
    }
    [contenteditable="true"]:focus {
      outline: 2px solid #4f46e5;
      outline-offset: 4px;
      background-color: rgba(99, 102, 241, 0.05);
    }
  </style>
</head>
<body class="bg-gray-100">

  <!-- Container untuk memuat tampilan web asli -->
  <div id="webContainer" class="min-h-screen">
    <div class="p-10 text-center font-sans text-gray-500">Memuat tampilan web...</div>
  </div>

  <!-- Floating Admin Controller (Melayang di Bawah Layar) -->
  <div id="adminBar" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-gray-900/95 text-white px-6 py-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center gap-4 border border-gray-700 z-[999999]">
    <div class="flex items-center gap-2">
      <span class="inline-block w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
      <span class="text-sm font-semibold tracking-wide">Visual Admin Mode</span>
    </div>

    <div class="h-4 w-px bg-gray-700"></div>

    <button id="saveBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-xl transition flex items-center gap-2 shadow-lg">
      💾 Simpan Perubahan Web
    </button>

    <button id="tokenBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3 py-2 rounded-xl transition">
      🔑 Set Token
    </button>
  </div>

  <script>
    const REPO_OWNER = 'bprodrive';
    const REPO_NAME = 'bprodrive.github.io';
    const TARGET_FILE = 'index.html'; // File web utama yang diedit secara visual

    let currentSha = '';

    // Check Token GitHub saat pertama buka
    function checkToken() {
      let token = localStorage.getItem('gh_pat_token');
      if (!token) {
        token = prompt('Masukkan GitHub Personal Access Token (PAT) Anda:');
        if (token) {
          localStorage.setItem('gh_pat_token', token.trim());
        } else {
          alert('Token diperlukan untuk bisa menyimpan perubahan!');
        }
      }
      return token;
    }

    document.getElementById('tokenBtn').addEventListener('click', () => {
      const newToken = prompt('Masukkan GitHub PAT baru:');
      if (newToken) {
        localStorage.setItem('gh_pat_token', newToken.trim());
        alert('Token berhasil diperbarui!');
      }
    });

    // 1. Fetch & Render Tampilan Web Utama
    async function loadWebForEditing() {
      const container = document.getElementById('webContainer');
      const token = checkToken();

      try {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TARGET_FILE}`, {
          headers: token ? { 'Authorization': `token ${token}` } : {}
        });

        if (!response.ok) throw new Error('Gagal memuat file web dari GitHub.');

        const data = await response.json();
        currentSha = data.sha;

        // Decode Base64 ke HTML lengkap
        const fullHtml = decodeURIComponent(escape(atob(data.content)));

        // Buat parser untuk memisahkan head (CSS/Font) dan body
        const parser = new DOMParser();
        const doc = parser.parseFromString(fullHtml, 'text/html');

        // Pindahkan semua style/link CSS dari head asli ke document admin
        doc.head.querySelectorAll('link, style').forEach(node => {
          document.head.appendChild(node.cloneNode(true));
        });

        // Render bagian body ke container
        container.innerHTML = doc.body.innerHTML;

        // Aktifkan mode Inline Editing pada teks & judul
        makeElementsEditable();

      } catch (err) {
        container.innerHTML = `<div class="p-10 text-red-500 text-center font-sans">Error: ${err.message}</div>`;
      }
    }

    // 2. Aktifkan ContentEditable untuk elemen Teks
    function makeElementsEditable() {
      const container = document.getElementById('webContainer');
      
      // Pilih elemen-elemen teks umum (Heading, Paragraf, Span, Button text, dsb)
      const editableSelectors = 'h1, h2, h3, h4, h5, h6, p, a, button, span, li, b, strong';
      const elements = container.querySelectorAll(editableSelectors);

      elements.forEach(el => {
        // Jangan aktifkan pada baris admin controller
        if (!el.closest('#adminBar')) {
          el.setAttribute('contenteditable', 'true');
        }
      });
    }

    // 3. Simpan Seluruh HTML kembali ke GitHub
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const token = checkToken();
      if (!token) return;

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.innerText = '⏳ Menyimpan...';
      saveBtn.disabled = true;

      // Bersihkan atribut contenteditable sebelum disimpan ke server
      const containerClone = document.getElementById('webContainer').cloneNode(true);
      containerClone.querySelectorAll('[contenteditable]').forEach(el => {
        el.removeAttribute('contenteditable');
      });

      // Ambil kode HTML bersih hasil editan
      const cleanHtml = containerClone.innerHTML;

      // Encode UTF-8 ke Base64
      const encodedContent = btoa(unescape(encodeURIComponent(cleanHtml)));

      try {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TARGET_FILE}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Update website content via Visual Admin Editor',
            content: encodedContent,
            sha: currentSha
          })
        });

        if (!response.ok) throw new Error('Gagal menyimpan ke GitHub.');

        const result = await response.json();
        currentSha = result.content.sha; // Update SHA baru

        alert('✅ Perubahan berhasil disimpan! GitHub Pages akan meng-update tampilan publik dalam 1-2 menit.');
      } catch (err) {
        alert('❌ Error: ' + err.message);
      } finally {
        saveBtn.innerText = '💾 Simpan Perubahan Web';
        saveBtn.disabled = false;
      }
    });

    // Jalankan saat halaman dibuka
    window.addEventListener('DOMContentLoaded', loadWebForEditing);
  </script>
</body>
</html>
